version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly }
    # Majors that break the build: migrate deliberately, not via an automatic PR.
    #  typescript 7: typescript-eslint does not support it yet (lint crashes)
    #  @tanstack/react-table 9: useReactTable / getCoreRowModel removed (build fails)
    #  pdfjs-dist 6: isEvalSupported and PDFDocumentProxy.destroy removed (typecheck fails);
    #    the viewer is security-sensitive, so migrate it with a browser check
    ignore:
      - dependency-name: pdfjs-dist
        update-types: ["version-update:semver-major"]
      # pdfjs-dist >=5.6.83 <6.2.108: arbitrary JavaScript execution on opening a malicious PDF
      # (GHSA-hq66-cqwq-w95j). Stay on 5.4.x until the viewer moves to a fixed 6.x release.
      - dependency-name: pdfjs-dist
        versions: [">= 5.6.0, < 6.0.0"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@tanstack/react-table"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
