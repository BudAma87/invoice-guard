name: Bug report
description: Something is not working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the invoice_id. Never attach real invoices.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [ingest, ocr, extraction (LLM), validation rules, review UI, ERP posting, other]
