[project]
name = "invoice-guard"
version = "0.1.0"
description = "AI-powered invoice validation pipeline (LangGraph + Claude)"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0",
  "langgraph-checkpoint-sqlite>=2.0",
  "anthropic>=0.40",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "aiokafka>=0.11",
  "httpx>=0.27",
]

[project.optional-dependencies]
ocr = ["paddleocr>=2.8", "opencv-python-headless>=4.10"]
postgres = ["psycopg[binary]>=3.2", "langgraph-checkpoint-postgres>=2.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_guard"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict_optional = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
