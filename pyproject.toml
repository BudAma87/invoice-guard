[project]
name = "invoice-guard"
version = "0.2.0"
description = "Invoice validation pipeline: Kafka -> extract -> deterministic rules -> human review -> exactly-once ERP posting"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "httpx>=0.27",
  "anthropic>=0.40",
]

[project.optional-dependencies]
kafka = ["aiokafka>=0.11"]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "hypothesis>=6.100", "ruff>=0.8", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["libs", "services"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["apps", "libs/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict_optional = true
packages = ["libs", "services"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
